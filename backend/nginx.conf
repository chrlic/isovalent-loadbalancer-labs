events {}

http {
    # Determine protocol name from port for use in response body
    map $server_port $proto {
        443  "https";
        8443 "https";
        default "http";
    }

    server {
        listen 8080;

        location /healthz {
            default_type text/plain;
            return 200 'OK';
        }

        location /status {
            default_type text/plain;
            return 200 'hostname:   $hostname
local_ip:   $server_addr
local_port: $server_port
protocol:   $proto
path:       $request_uri
client_ip:  $remote_addr
request:    $request
';
        }

        location /list {
            default_type text/plain;
            return 200 'hostname:   $hostname
local_ip:   $server_addr
local_port: $server_port
protocol:   $proto
path:       $request_uri
client_ip:  $remote_addr
request:    $request
';
        }

        location / {
            default_type text/html;
            return 200 '<!DOCTYPE html>
<html>
<head><title>Backend: $hostname</title></head>
<body>
<h1>Backend Server</h1>
<table>
  <tr><td><b>Hostname</b></td><td>$hostname</td></tr>
  <tr><td><b>Local IP</b></td><td>$server_addr</td></tr>
  <tr><td><b>Local port</b></td><td>$server_port</td></tr>
  <tr><td><b>Protocol</b></td><td>$proto</td></tr>
  <tr><td><b>Path</b></td><td>$request_uri</td></tr>
  <tr><td><b>Client IP</b></td><td>$remote_addr</td></tr>
  <tr><td><b>Request</b></td><td>$request</td></tr>
</table>
</body>
</html>';
        }
    }

    server {
        listen 8443 ssl;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;

        location /healthz {
            default_type text/plain;
            return 200 'OK';
        }

        location /status {
            default_type text/plain;
            return 200 'hostname:   $hostname
local_ip:   $server_addr
local_port: $server_port
protocol:   $proto
path:       $request_uri
client_ip:  $remote_addr
request:    $request
';
        }

        location /list {
            default_type text/plain;
            return 200 'hostname:   $hostname
local_ip:   $server_addr
local_port: $server_port
protocol:   $proto
path:       $request_uri
client_ip:  $remote_addr
request:    $request
';
        }

        location / {
            default_type text/html;
            return 200 '<!DOCTYPE html>
<html>
<head><title>Backend: $hostname</title></head>
<body>
<h1>Backend Server</h1>
<table>
  <tr><td><b>Hostname</b></td><td>$hostname</td></tr>
  <tr><td><b>Local IP</b></td><td>$server_addr</td></tr>
  <tr><td><b>Local port</b></td><td>$server_port</td></tr>
  <tr><td><b>Protocol</b></td><td>$proto</td></tr>
  <tr><td><b>Path</b></td><td>$request_uri</td></tr>
  <tr><td><b>Client IP</b></td><td>$remote_addr</td></tr>
  <tr><td><b>Request</b></td><td>$request</td></tr>
</table>
</body>
</html>';
        }
    }
}
